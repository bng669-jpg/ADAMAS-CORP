kind = "web"
previewPath = "/"
title = "ADAMAS"
version = "1.0.0"
id = "artifacts/adamas"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19750

[services.development]
run = "pnpm --filter @workspace/adamas run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/adamas", "run", "build" ]
publicDir = "artifacts/adamas/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19750"
BASE_PATH = "/"
